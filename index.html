<!DOCTYPE html>
<html lang="fr">

<head> <meta charset="UTF-8">

	<title>Enonçant général</title>

	<script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	
	<style> body {
		margin: 0;
		font-family: sans-serif;
		overflow: hidden;
		background: #f0f0f0; }
			#mynetwork {
		width: 100vw;
		height: 100vh;
		display: block; }
		
		/* L'interface utilisateur (boîte blanche) */ #ui-layer { 
		position: absolute;
		top: 20px;
		left: 20px;
		background: rgba(255, 255, 255, 0.95);
		padding: 15px;
		border-radius: 0px;
		box-shadow: 0 4px 15px rgba(0,0,0,0.2);
		cursor: grab;
		min-width: 250px;
		z-index: 1000; border:
		1px solid #ccc; } 
		
		#ui-layer:active {
		cursor: move; } 
		
		.active { 
		background-color: #000 !important; color: #fff !important; border: 1px solid #000; } /* Style général des boutons */ button { cursor: pointer; border: 1px solid #999; background: #fff; padding: 5px 10px; margin: 2px; font-size: 14px; } button:hover { background: #fff; } /* Zone de texte */ textarea { width: 100%; box-sizing: border-box; margin-bottom: 10px; padding: 5px; font-family: sans-serif; font-size: 14px; resize: vertical; border: 1px solid #ccc; border-radius: 4px; } /* Inputs et selects */ input[type="text"], select { padding: 5px; margin-top: 5px; border: 1px solid #fff; border-radius: 0px; width: 100%; box-sizing: border-box; } /* Petit texte de statut */ #status { font-size: 11px; color: #666; margin-bottom: 8px; font-style: italic; border-bottom: 1px solid #eee; padding-bottom: 4px; } hr { border: 0; border-top: 1px solid #ddd; margin: 10px 0; } label { font-size: 12px; font-weight: bold; display: block; margin-bottom: 3px; } #fontFace { background-color: #ffffff; color: #000000; /* Bordures et forme */ border: 1px solid #fff; border-radius: 0px; /* Dimensions et espacement */ padding: 5px 8px; font-size: 14px; font-family: sans-serif; /* Curseur */ cursor: pointer; /* Tentative de forçage pour les navigateurs modernes */ appearance: none; -webkit-appearance: none; -moz-appearance: none; } /* Indicateur de connexion Supabase */ #ende { font-size: 11px; color: #666; margin-bottom: 8px; font-style: italic; } </style> </head> <body> <!-- ZONE DE L'INTERFACE (UI) --> <div id="ui-layer">

<!-- Statut/Messages -->
<div id="status">Maniez un lieu pour vous y lier.</div>

<!-- Déplacements -->
<div id="ende"></div>

<!-- Zones -->
<label for="newText">Service :</label>
<textarea id="newText" rows="4" placeholder="Écrivez votre texte ici..."></textarea>

<!-- Presse -->
<div style="margin-bottom: 10px;">
    <span style="font-size:12px; margin-right:5px;">Sign</span>

    <button id="éale" onclick="toggleBold()" title="Gras">
        <b>B</b>
    </button>

    <button id="entique" onclick="toggleItalic()" title="Italique">
        I
    </button>
    
    <select id="fontFace" onchange="setFont(this.value)" style="width: auto; float: right;">
        <option value="Abadi">PREMIÈRE POLICE</option>
        <option value="MS Gothic, serif">DEUXIÈME POLICE</option>
        <option value="Arial">TROISIÈME POLICE</option>
        <option value="Sitka Subheading Semibold, serif">ETATS</option>
        <option value="Courier New, NSimSun">GOUVERNEMENTS</option>
        <option value="OCR A Ewtended">SIXIÈME POLICE</option>
    </select>
</div>


<button onclick="rentePermission()" style="width: 100%; background: #333; color: white; font-weight: bold; margin-bottom: 5px;">
    EXPLOITER - RENDRE PUBLIC
</button>

<button id="rail" onclick="createLinkBetweenSelected()" style="width: 100%; background: #d9534f; color: white; font-weight: bold; display: none; margin-bottom: 10px;">
</button>

<hr>
<label for="searchInput">Requérir :</label>

<div style="display: flex; gap: 5px;">
    <input type="text" id="searchInput" placeholder="Termes...">
    <button onclick="searchInWeb()" style="margin:0;">OK</button>
</div>

</div> <!-- ZONE DE LA TOILE (RÉSEAU) --> <div id="mynetwork"></div> <!-- Chargement du script collaboratif --> <script src="script.js"></script> </body> </html>
